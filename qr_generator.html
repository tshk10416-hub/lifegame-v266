    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: #333; margin: 0; padding: 40px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 20px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        h1 { color: #f5576c; text-align: center; margin-bottom: 20px; }
        p.info { text-align: center; color: #666; margin-bottom: 30px; font-size: 1.1em; }
        .qr-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 30px; 
        }
        .qr-section h2 { 
            grid-column: 1 / -1; 
            margin-top: 40px; 
            margin-bottom: 20px; 
            padding-bottom: 10px; 
            border-bottom: 2px solid #eee; 
            color: #4a5568; 
            font-size: 1.5em;
        }
        .qr-item { 
            background: #fff; 
            border: 1px solid #e2e8f0; 
            border-radius: 15px; 
            padding: 25px; 
            text-align: center; 
            transition: transform 0.2s, box-shadow 0.2s; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .qr-item:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); 
            border-color: #cbd5e0;
        }
        .qr-item h3 { 
            margin: 0 0 10px 0; 
            font-size: 1.1em; 
            color: #2d3748; 
            height: 2.4em; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .qr-item p { 
            margin: 0 0 15px 0; 
            color: #718096; 
            font-size: 0.9em; 
            font-family: monospace; 
            background: #edf2f7; 
            padding: 2px 8px; 
            border-radius: 4px; 
        }
        .qr-code-div { 
            padding: 10px; 
            background: white; 
            border-radius: 5px; 
        }
        @media print {
            .qr-item { break-inside: avoid; border: 1px solid #ccc; box-shadow: none; }
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 0; }
            h1, p.info { display: none; }
        }
    </style>
</head>

        function generateQRCodes() {
            const container = document.getElementById('qr-container');
            const types = {
                'job': '職業カード',
                'marriage': '結婚カード',
                'children': '子どもカード',
                'house': '住宅カード',
                'car': '自動車カード',
                'insurance': '保険カード',
                'life_event': 'ライフイベントカード',
                'social_event': 'ソーシャルイベントカード',
                'social_event_asset_change': 'ソーシャルイベントカード (拡張 S013〜)',
                'investment': '投資カード',
                'retirement': '退職金データ(裏)',
                'retirement_trigger': '退職金カード(表)'
            };

            let currentType = null;
            let currentGrid = null;

            Object.keys(CARD_DATA).forEach(cardId => {
                const card = CARD_DATA[cardId];
                
                // セクションの切り替わり判定
                if (card.type !== currentType) {
                    currentType = card.type;
                    
                    const sectionDiv = document.createElement('div');
                    sectionDiv.className = 'qr-section';
                    sectionDiv.style.gridColumn = '1 / -1';
                    sectionDiv.style.display = 'contents';

                    const titleH2 = document.createElement('h2');
                    titleH2.textContent = types[currentType] || 'その他';
                    
                    container.appendChild(titleH2);
                }

                const qrUrl = baseUrl + cardId;

                const itemDiv = document.createElement('div');
                itemDiv.className = 'qr-item';

                const titleH3 = document.createElement('h3');
                titleH3.textContent = card.title;

                const idp = document.createElement('p');
                idp.textContent = `ID: ${cardId}`;

                const qrDiv = document.createElement('div');
                qrDiv.className = 'qr-code-div';
                qrDiv.id = `qrcode-${cardId}`;

                itemDiv.appendChild(titleH3);
                itemDiv.appendChild(idp);
                itemDiv.appendChild(qrDiv);
                container.appendChild(itemDiv);

                new QRCode(document.getElementById(`qrcode-${cardId}`), {
                    text: qrUrl,
                    width: 200,
                    height: 200,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            });
        }

        document.addEventListener('DOMContentLoaded', generateQRCodes);
    </script>
