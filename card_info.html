        }

            border: 2px solid #FEEABC;
            padding: 20px;
            border-radius: 10px;

            background: #FFFBF5;
        }
        .card-effect p {

            "L029": { title: "30代の過信「ぎっくり腰」", type: "life_event_asset_change", costsByIncome: { low: 3, mid: 5, high: 10 }, explanation: "子どもを抱き上げた瞬間に腰が爆発。「まだ若いから」という過信が砕け、保険適用外の高額な整体や鍼灸院に通い詰める。" },
            "L030": { title: "フードデリバリーVIP会員", type: "life_event_asset_change", costsByIncome: { low: 5, mid: 12, high: 30 }, explanation: "「自炊する時間がもったいない」と言い訳し、毎日のようにデリバリーを頼んだ結果、月の食費が家賃を超えてしまう。" },
            "L031": { title: "急な子どもの夜間発熱", type: "life_event_asset_change", costsByIncome: { low: 3, mid: 5, high: 10 }, explanation: "深夜に40度の熱。夜間救急へのタクシー代や、翌日仕事を休めず手配した「高額な病児保育・シッター代」が飛んでいく。" },
            "L032": { title: "深夜のソシャゲ重課金", type: "life_event_asset_change", costsByIncome: { low: 3, mid: 10, high: 30 }, explanation: "仕事と育児のストレスでガチャに熱くなり、「推し」が出るまで課金。翌月のクレジットカードの請求額に絶望する。" },
            "L033": { title: "結婚記念日アニバーサリー", type: "life_event_asset_change", costsByIncome: { low: 3, mid: 5, high: 10 }, explanation: "子どもを実家に預け、久しぶりに夫婦2人で高級ホテルのディナーへ。新婚時代を思い出し、絆が深まる。" },
            "L034": { title: "子どもの習い事フルコース", type: "life_event_asset_change", costsByIncome: { low: 5, mid: 15, high: 30 }, explanation: "水泳、英語、プログラミング…子どもの可能性を広げたい一心で掛け持ちさせ、月謝と指定ユニフォーム代の総額に震える。" },
            "L035": { title: "最新時短家電への投資", type: "life_event_asset_change", costsByIncome: { low: 15, mid: 30, high: 50 }, explanation: "「時間をお金で買う」を合言葉に、ドラム式洗濯乾燥機と最新ロボット掃除機を一括購入。生活は劇的に楽になる。" },
            "L036": { title: "空飛ぶおもちゃと大画面テレビ", type: "life_event_asset_change", costsByIncome: { low: 8, mid: 15, high: 30 }, explanation: "子どもが家の中で全力で投げたおもちゃがテレビに直撃。しかし火災保険（家財）で直せることを学ぶ。" },
            "L037": { title: "「使途不明金」発覚と家計会議", type: "life_event_asset_change", costsByIncome: { low: -30, mid: -60, high: -120 }, explanation: "お互いの無駄遣いが発覚し大喧嘩。しかし家計簿アプリを導入して通信費等を見直した結果、家計がスリム化する。" },

            // --- 40代向けライフイベントカード (L038 - L057) ---
            "L038": { title: "中間管理職のストレス散財", type: "life_event_asset_change", costsByIncome: { low: 5, mid: 15, high: 50 }, explanation: "上司と部下の板挟みストレスから逃れるため、身の丈に合わない高級時計やゴルフセットを衝動買いしてしまう。" },
            "L039": { title: "過労で突然の入院と手術", type: "life_event_asset_change", costsByIncome: { low: 15, mid: 30, high: 50 }, explanation: "40代のガタが来る時期。過労で倒れ、手術と入院を余儀なくされる。高額な医療費が家計にのしかかる。" },
            "L040": { title: "子どもの反抗期と壁の穴", type: "life_event_asset_change", costsByIncome: { low: 3, mid: 5, high: 10 }, explanation: "我が子が何を言っても「うるせぇ」しか言わなくなり、怒りで部屋の壁に穴を開ける。クロスの修繕費が請求される。" },
            "L041": { title: "白髪とシワへの徹底抗戦", type: "life_event_asset_change", costsByIncome: { low: 3, mid: 10, high: 30 }, explanation: "鏡を見るたび老いを実感。毎月の高級サロンでの白髪染めや、高額なアンチエイジング美容液の定期購入を始める。" },
            "L042": { title: "塾・予備校課金が天を突く", type: "life_event_asset_change", costsByIncome: { low: 30, mid: 60, high: 150 }, explanation: "高校・大学受験に向けて大手進学塾へ。夏期講習・合宿代の請求書を見て「これは大人のソシャゲか」と悟る。" },
            "L043": { title: "同窓会での見栄張り", type: "life_event_asset_change", costsByIncome: { low: 5, mid: 10, high: 30 }, explanation: "出世した友人に負けたくない一心で、同窓会の直前にデパートでブランドスーツと高級靴を新調してしまう。" },
            "L044": { title: "中年の危機（ミッドライフ）", type: "life_event_asset_change", costsByIncome: { low: 10, mid: 30, high: 100 }, explanation: "「自分の人生このままでいいのか」と謎の焦りを感じ、突然若者向けのロードバイクや派手なオープンカーを買う。" },
            "L045": { title: "メタボ対策のパーソナルジム", type: "life_event_asset_change", costsByIncome: { low: 5, mid: 20, high: 50 }, explanation: "自己流ダイエットの限界を悟り、数十万する「結果にコミットする」完全個室パーソナルジムに入会する。" },
            "L046": { title: "子どもの部活の全国大会応援", type: "life_event_asset_change", costsByIncome: { low: 5, mid: 15, high: 30 }, explanation: "子どもが全国大会に出場！遠方までの家族全員の飛行機代と宿泊費で大赤字だが、涙が出るほどの感動を味わう。" },
            "L047": { title: "「大人の趣味」沼への没入", type: "life_event_asset_change", costsByIncome: { low: 5, mid: 20, high: 60 }, explanation: "家族が土日に付き合ってくれなくなり、ソロキャンプやカメラなど、ハイエンドな機材を集める趣味に大金をつぎ込む。" },
            "L048": { title: "洗濯機の水漏れ大パニック", type: "life_event_asset_change", costsByIncome: { low: 30, mid: 50, high: 100 }, explanation: "洗濯機のホースが外れ、床や階下を水浸しにしてしまう。高額な修繕費や賠償金に青ざめるが、火災保険（水濡れ・個人賠償）で全額カバーできると学ぶ。" },
            "L049": { title: "老眼鏡（シニアグラス）デビュー", type: "life_event_asset_change", costsByIncome: { low: 1, mid: 3, high: 10 }, explanation: "スマホの文字が見えなくなり、有名ブランドの数万円するオシャレな老眼鏡を家・職場・車用に複数買いする。" },
            "L050": { title: "ペットのシニア期・医療費", type: "life_event_asset_change", costsByIncome: { low: 10, mid: 20, high: 50 }, explanation: "愛犬・愛猫が体調を崩し手術へ。人間の保険が効かないため、お会計の金額に目玉が飛び出るが命には代えられない。" },
            "L051": { title: "歯のトラブル・自費診療", type: "life_event_asset_change", costsByIncome: { low: 5, mid: 15, high: 40 }, explanation: "歯痛で駆け込んだ歯医者で「セラミックかインプラントですね」と宣告され、保険適用外の治療でボーナスが消滅。" },
            "L052": { title: "親の実家をバリアフリー改修", type: "life_event_asset_change", costsByIncome: { low: 5, mid: 10, high: 30 }, explanation: "実家に手すり等を設置！親の要介護認定により「介護保険の住宅改修費制度（上限20万円）」を活用し、賢く費用を抑えつつ親孝行できた！" },
            "L053": { title: "子どもの短期留学サポート", type: "life_event_asset_change", costsByIncome: { low: 30, mid: 80, high: 200 }, explanation: "かわいい子には旅をさせよ。子どもの成長と国際感覚を養うため、数週間の語学留学費用を親心でポンと出す。" },
            "L054": { title: "もらい事故で車が破損", type: "life_event_asset_change", costsByIncome: { low: 20, mid: 50, high: 100 }, explanation: "駐車場での当て逃げや追突事故により愛車が大きく破損。修理代の請求書を見て青ざめる。" },
            "L055": { title: "推し活の「遠征」ガチ勢化", type: "life_event_asset_change", costsByIncome: { low: 5, mid: 15, high: 40 }, explanation: "アイドルや舞台の全国ツアーを全通。新幹線代、ホテル代、グッズのコンプリート買いで財産がものすごい勢いで溶ける。" },
            "L056": { title: "子どもの自転車トラブルで賠償", type: "life_event_asset_change", costsByIncome: { low: 30, mid: 50, high: 100 }, explanation: "子どもが自転車で他人の高級車に激突！高額修理代に青ざめるが、実は火災保険の「個人賠償責任特約」で全額カバーできると学ぶ。" },
            "L057": { title: "副業スキルの本格化と結実", type: "life_event_asset_change", costsByIncome: { low: -100, mid: -100, high: -100 }, explanation: "30代からコツコツと磨いてきた副業スキル（動画編集やコンサル等）が完全に軌道に乗り、安定した大きな副収入源となる。長年の努力が実を結び資産が大きく増加する！" },

            // --- 50代向けライフイベントカード (L058 - L077) ---
            "L058": { title: "役職定年の冷たい風", type: "life_event_asset_change", costsByIncome: { low: -30, mid: -50, high: -100 }, explanation: "役職を解かれボーナス等が減少。プライドが傷つくと共に、家計の見直しを迫られる。" },
            "L059": { title: "子どもの「巣立ち」と引越し援助", type: "life_event_asset_change", costsByIncome: { low: 30, mid: 50, high: 100 }, explanation: "子どもが家を出る。寂しさをこらえ、新居の敷金礼金や家具家電をプレゼントして送り出す。" },
            "L060": { title: "親の介護施設入居費用（一部負担）", type: "life_event_asset_change", costsByIncome: { low: 50, mid: 100, high: 300 }, explanation: "親が有料老人ホームへ。高額な入居一時金を、親の貯金や兄弟と分担しつつ、自分も一部を負担する。" },
            "L061": { title: "子育て終了記念！豪華夫婦旅行", type: "life_event_asset_change", costsByIncome: { low: 30, mid: 50, high: 100 }, explanation: "学費の支払いがすべて終わった記念に、海外旅行や高級温泉宿へ繰り出す。" },
            "L062": { title: "第二の青春！大学への学び直し", type: "life_event_asset_change", costsByIncome: { low: 50, mid: 80, high: 150 }, explanation: "定年後を見据え、通信制大学や専門学校に入学。脳の衰えと戦いながら知的好奇心を満たす。" },
            "L063": { title: "熟年離婚回避の慰謝料的プレゼント", type: "life_event_asset_change", costsByIncome: { low: 10, mid: 30, high: 100 }, explanation: "2人きりの生活の息苦しさから離婚の危機。パートナーへ高級なジュエリーなどを贈って繋ぎ止める。" },
            "L064": { title: "子どもの結婚式で親も大奮発", type: "life_event_asset_change", costsByIncome: { low: 50, mid: 100, high: 200 }, setFlag: "childMarried", excludeFlag: "childMarried", explanation: "衣装代やお色直しの費用の一部を気前よくキャッシュで負担する。" },
            "L065": { title: "人間ドックでポリープ発見", type: "life_event_asset_change", costsByIncome: { low: 5, mid: 10, high: 30 }, explanation: "初期の手術と数日の入院。健康への不安を抱えつつ、医療費の出費が発生する。" },
            "L066": { title: "新しい家族のお迎え", type: "life_event_asset_change", costsByIncome: { low: 20, mid: 40, high: 80 }, setFlag: "hasPet", explanation: "子どもが大きくなり家が静かになったため、新しいペットを迎える。" },
            "L067": { title: "シミ・シワ消しの美容医療沼", type: "life_event_asset_change", costsByIncome: { low: 10, mid: 30, high: 80 }, explanation: "老け込みたくない一心で、最新のシミ取りレーザーなど自費診療の美容クリニックに定期課金する。" },
            "L068": { title: "実家の「墓じまい」「仏壇じまい」", type: "life_event_asset_change", costsByIncome: { low: 30, mid: 50, high: 100 }, explanation: "親の希望で、遠方の墓を永代供養に変更。お布施や墓石の解体工事費用などで出費が発生する。" },
            "L069": { title: "謎の健康器具コレクション", type: "life_event_asset_change", costsByIncome: { low: 5, mid: 10, high: 20 }, explanation: "深夜のテレビショッピングにそそのかされ、「血流が良くなるマット」などを買い漁る。" },
            "L070": { title: "リターンライダーの大型バイク購入", type: "life_event_asset_change", costsByIncome: { low: 50, mid: 100, high: 200 }, explanation: "若い頃に諦めた大型バイクの免許を今さら取得。車体と革ジャンを買い揃え大金をつぎ込む。" },
            "L071": { title: "愛犬・愛猫の看取りとペット葬", type: "life_event_asset_change", costsByIncome: { low: 10, mid: 15, high: 30 }, requireFlag: "hasPet", explanation: "長年家族を支えてくれたペットが天国へ。手厚い医療費と立派な葬儀代がかかるが、十分な見送りができた。" },
            "L072": { title: "詐欺スレスレの「高配当ファンド」", type: "life_event_asset_change", costsByIncome: { low: 30, mid: 100, high: 300 }, explanation: "老後資金に焦り、怪しい知人の投資話に乗って資金を見事に溶かす（高い勉強代）。" },
            "L073": { title: "夫婦でゴルフ場の会員権購入", type: "life_event_asset_change", costsByIncome: { low: 50, mid: 100, high: 300 }, explanation: "老後のプレイ代を安くするためと言い訳して数百万円の「ゴルフ場会員権」を買う。" },
            "L074": { title: "衰え防止の「高級自転車」購入", type: "life_event_asset_change", costsByIncome: { low: 10, mid: 20, high: 50 }, explanation: "膝に負担をかけず運動するため、数十万する電動アシスト付きの高級スポーツ自転車（e-bike）を購入する。" },
            "L075": { title: "初孫誕生！全額負担の申し出", type: "life_event_asset_change", costsByIncome: { low: 10, mid: 30, high: 50 }, requireFlag: "childMarried", setFlag: "grandchildBorn", excludeFlag: "grandchildBorn", explanation: "嬉しさのあまり財布の紐が崩壊。高級ベビーカーからお宮参りの費用まで大盤振る舞い！" },
            "L076": { title: "実家の空き家問題・解体費用", type: "life_event_asset_change", costsByIncome: { low: 100, mid: 150, high: 300 }, explanation: "親が施設に入り誰も住まなくなった実家。特定空き家になる前に解体して更地にする。" },
            "L077": { title: "夫婦別室のためのプチリフォーム", type: "life_event_asset_change", costsByIncome: { low: 10, mid: 50, high: 100 }, explanation: "いびきや生活リズムの違いがストレスになり、快適な睡眠を得るために寝室を2つに仕切る。" },

            // --- 60代向けライフイベントカード (L078 - L099) ---
            "L078": { title: "定年直前！フライングご褒美", type: "life_event_asset_change", costsByIncome: { low: 10, mid: 30, high: 50 }, explanation: "いよいよ数年後で定年。気が大きくなってフライングで「自分へのご褒美」を買ってしまう。" },
            "L079": { title: "還暦（60歳）のセルフプロデュース", type: "life_event_asset_change", costsByIncome: { low: 5, mid: 10, high: 30 }, explanation: "「赤いちゃんちゃんこは着ない！」と、自分で高級ディナーや旅行を企画し還暦を祝う。" },
            "L080": { title: "孫への「歩くATM」化", type: "life_event_asset_change", costsByIncome: { low: 5, mid: 15, high: 30 }, requireFlag: "grandchildBorn", explanation: "孫の「買って！」の破壊力に思考停止。最新ゲーム機などを笑顔で買い与える。" },
            "L081": { title: "定年後のクルーズ旅行予約", type: "life_event_asset_change", costsByIncome: { low: 20, mid: 50, high: 100 }, explanation: "退職金が入ることを見越し、長年の夢だった豪華客船の旅を先行予約して手付金を支払う。" },
            "L082": { title: "病院の待合室が「サロン化」", type: "life_event_asset_change", costsByIncome: { low: 2, mid: 5, high: 10 }, explanation: "定期通院の待ち時間が同世代との情報交換の場に。謎のサプリなどを勧められて買ってしまう。" },
            "L083": { title: "定年前の生前整理と断捨離", type: "life_event_asset_change", costsByIncome: { low: 10, mid: 20, high: 50 }, explanation: "子どもに迷惑をかけまいと、業者を呼んで家中の不用品を2トントラックで一気に廃棄。" },
            "L084": { title: "孫の教育資金の一括贈与", type: "life_event_asset_change", costsByIncome: { low: 50, mid: 150, high: 300 }, requireFlag: "grandchildBorn", explanation: "相続税対策を兼ねて、孫の進学資金として「教育資金の一括贈与（非課税）」制度を使いドカンと振り込む。" },
            "L085": { title: "年金定期便ショック", type: "life_event_asset_change", costsByIncome: { low: 10, mid: 30, high: 50 }, explanation: "65歳からの年金見込額を見て青ざめ、不安から怪しい「老後資金対策セミナー」に通ってしまう。" },
            "L086": { title: "台風で屋根と窓ガラスが破損", type: "life_event_asset_change", costsByIncome: { low: 30, mid: 50, high: 100 }, explanation: "猛烈な台風で家屋が破損。高額な修理費に絶望するが、火災保険の「風災補償」でカバーできると学ぶ。" },
            "L087": { title: "退職金運用狙いのプレ営業", type: "life_event_asset_change", costsByIncome: { low: 30, mid: 100, high: 200 }, explanation: "銀行窓口で「もうすぐ定年ですね」と特別プランに乗せられ、手数料の高い投資信託を買わされる。" },
            "L088": { title: "愛犬・愛猫向けシニアリフォーム", type: "life_event_asset_change", costsByIncome: { low: 10, mid: 30, high: 50 }, requireFlag: "hasPet", explanation: "足腰が弱ってきたペットのため、滑りにくい床材への変更やスロープの設置工事を行う。" },
            "L089": { title: "テレビショッピングのVIP顧客", type: "life_event_asset_change", costsByIncome: { low: 5, mid: 10, high: 30 }, explanation: "夜中に眠れずテレビを見て、カニや高枝切りバサミなどを毎晩のように電話注文してしまう。" },
            "L090": { title: "白内障の手術（多焦点レンズ）", type: "life_event_asset_change", costsByIncome: { low: 30, mid: 60, high: 100 }, explanation: "目の霞みを治すため、あえて高額な「多焦点眼内レンズ」を選択。出費は痛いが視界は超クリアに！" },
            "L091": { title: "二世帯住宅への大規模リフォーム", type: "life_event_asset_change", costsByIncome: { low: 100, mid: 300, high: 500 }, explanation: "子ども家族と同居するため、家を「完全分離型」の二世帯住宅にリフォーム。老後資金の大半が吹き飛ぶ。" },
            "L092": { title: "プロに頼む「公正証書遺言」", type: "life_event_asset_change", costsByIncome: { low: 10, mid: 20, high: 30 }, explanation: "「争族」を防ぐため、公証役場に依頼して法的に完璧な遺言書を作成。大人の責任を果たしホッとする。" },
            "L093": { title: "シニアサークルで「ボス」になり散財", type: "life_event_asset_change", costsByIncome: { low: 5, mid: 15, high: 50 }, explanation: "地域のクラブで役員に就任。元会社員のプライドから見栄を張り、飲み会費用を全額奢って資産を減らす。" },

            "S016": { title: "ペット税の導入", type: "social_event_asset_change", costsByIncome: { low: 0, mid: 0, high: 0 }, explanation: "動物保護の財源としてペット税が新設。ペットを飼っているプレイヤーのみ税金を徴収される！", conditionPenalty: { flag: "hasPet", amount: 10 } },
            "S017": { title: "インフラ老朽化で一斉値上げ", type: "social_event_asset_change", costsByIncome: { low: 3, mid: 5, high: 10 }, explanation: "全国で公共インフラが寿命を迎え利用料金に転嫁された！家が広く使用量が多い高年収世帯ほど、累進制によって値上げのダメージ額が大きくなる。" },

            "S020": { title: "ふるさと納税制度の崩壊", type: "social_event_asset_change", costsByIncome: { low: 5, mid: 10, high: 15 }, explanation: "「返礼品競争」がエスカレートしすぎて国が制度を廃止。お得な思いができなくなり実質的な損に。" },

            "S023": { title: "歴史的「円安」の波", type: "social_event_asset_change", costsByIncome: { low: 10, mid: 30, high: 50 }, explanation: "1ドル160円を突破！輸入品が高騰。しかし投資信託（海外株式）を持っていれば円換算で価値が跳ね上がり、生活費増を上回る利益を生む！" },

            "S043": { title: "ステルス値上げ（シュリンクフレーション）の猛威", type: "social_event_asset_change", costsByIncome: { low: 2, mid: 3, high: 5 }, explanation: "食品や日用品の「内容量が減っているのに値段は同じ、あるいは値上げ」が横行。毎日の買い物で気づかないうちに生活費がジワジワと膨らみ、家計に確実なダメージを与える。" },

            "S045": { title: "社会保険料の引き上げショック", type: "social_event_asset_change", costsByIncome: { low: 100, mid: 150, high: 200 }, explanation: "高齢者を支えるため、現役世代の年金・健康保険料率が大幅アップ！一度発生すると、以降の年代でも10年分の保険料負担が恒久的に重くのしかかる。", setFlag: "socialInsuranceIncreased" },

            "S050": { title: "空前の「アウトドア・キャンプ」ブーム", type: "social_event_asset_change", costsByIncome: { low: 5, mid: 10, high: 20 }, explanation: "世間でキャンプが大流行！流行に乗って一式揃えようと出費がかさむ。ただし、既に過去のイベントで道具を持っている人は、不要なギアが高値で売れて逆に臨時収入となる！" },
